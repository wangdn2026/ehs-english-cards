<style>

  .progress-bar { flex: 1; height: 6px; background: var(--c-line); border-radius: 3px; overflow: hidden; }

  .rec-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c-orange-deep);

  /* 长按录音按钮：核心交互 */

  .btn-hold:active, .btn-hold.pressing {

    transform: scale(0.96);

  .rec-error .open-chrome-btn { display: inline-block; margin-top: 6px;

  .toast { position: fixed; top: 30%; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.85); color: #fff; padding: 12px 22px; border-radius: 24px;

  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, -10px); } to { opacity: 1; transform: translate(-50%, 0); } }
  /* 兜底：手动长按选择 URL 复制的弹窗 */

  .wave-bar.user { background: var(--c-good); }

  .rec-mask-timer { color: #fff; font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .rec-mask-hint { color: rgba(255,255,255,0.7); font-size: 12px; }
  .footer { text-align: center; padding: 24px 14px 30px; font-size: 11.5px; color: var(--c-soft); }

  .modal-mask { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    z-index: 100; align-items: center; justify-content: center; padding: 20px; }

  .modal-box { background: #fff; border-radius: 14px; padding: 22px 20px; max-width: 320px;

  .modal-box p { font-size: 13px; color: var(--c-charcoal); line-height: 1.6; margin: 0 0 14px; }

    padding: 9px 24px; border-radius: 18px; font-size: 13px; cursor: pointer; font-family: inherit; }

  /* ===== 讯飞 ISE 评分展示（2026-08-03 新增）===== */
  .score-loading { color: var(--c-soft); font-size: 12px; padding: 8px 12px;

  .score-loading::before { content: '⏳'; animation: spin 1s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .score-box { margin-top: 10px; padding: 10px 12px; border-radius: 8px;

  .score-header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .score-total { font-size: 24px; font-weight: 700; line-height: 1; }
  .score-grade { font-size: 12px; padding: 3px 8px; border-radius: 10px; color: #fff;

  .score-detail { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px;

  .score-detail b { color: var(--c-charcoal); font-weight: 600; }
  .score-words { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--c-line); }
  .score-words summary { font-size: 12px; color: var(--c-soft); cursor: pointer; user-select: none; }
  .score-words-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }

    color: #fff; border: none; border-radius: 14px; font-size: 12px; cursor: pointer; }
  .score-retry:active { background: var(--c-orange-deep); }
  /* 5 段主题色（沿用 4 档）+ Part 4-5 区分色 */
  .part-tag-PM { background: #3D405B !important; } /* 深炭灰 - PM */
  .part-tag-EHS { background: #C9623F !important; } /* 深橙 - EHS Manager */
  .part-tag-Visitor { background: #7BA7BC !important; } /* 天青 - Visitor */

</style>

<body>
<div class="top">
  <h1>跟读训练 · Vol09 博物馆 &amp; 承包商安全</h1>
  <div class="sub">听原音 → 录自己 → 听自己的录音</div>
  <span class="meta-tag" id="metaTag">5 段对话 · 24 行 · E. H. S. 训练营</span>
  <span class="mode-badge" id="modeBadge">检测中…</span>
</div>

<div class="progress">
  <div class="progress-bar"><div class="progress-fill" id="progFill"></div></div>
  <div class="progress-text" id="progText">0 / 4 已打卡</div>
</div>

<div class="tips" id="tipsBox">加载中…</div>


<div class="parts-container" id="partsContainer">
  <div style="text-align:center;padding:40px 20px;color:var(--c-soft)">加载对话数据…</div>
</div>



<div class="footer">
  安全五点半 E. H. S. 训练营 · 跟读训练模块<br>
  评分由讯飞 ISE 提供，1 次跟读 1 次评分，结果仅作跟读参考
</div>

<div class="modal-mask" id="recModal">
  <div class="modal-box">
    <h3 id="modalTitle">提示</h3>
    <p id="modalContent">内容</p>
    <button class="modal-close" id="modalCloseBtn">知道了</button>
  </div>
</div>

<script>
// ===== ISE 评分中转配置（2026-08-03 新增）=====
const ISE_PROXY = 'https://assured-asus-continuously-marilyn.trycloudflare.com';
const ISE_TOKEN = 'vol09-dongni-ise-2026-08-02-fixed-9f8a3b2c';
// 评分阈值（5 分制 → 4 档展示）
const SCORE_TIERS = [
  { min: 4.5, grade: '优秀 Excellent', color: '#4A8B3A' },
  { min: 3.5, grade: '良好 Good',      color: '#7CB069' },
  { min: 2.5, grade: '还行 OK',        color: '#B5D4A0' },
  { min: 0,   grade: '没读到 Try Again', color: '#E07A5F' },
];
function tierOf(score) {
  for (const t of SCORE_TIERS) if (score >= t.min) return t;
  return SCORE_TIERS[SCORE_TIERS.length - 1];
}

// ===== 数据加载（fetch 两个 JSON，合并为 PARTS_DATA）=====
let PARTS_DATA = [];
let TOTAL_LINES = 0;
async function loadData() {
  const [dResp, tResp] = await Promise.all([
    fetch('dialogue_vol09.json'),
    fetch('vol09_line_timings.json'),
  ]);
  if (!dResp.ok) throw new Error('dialogue_vol09.json ' + dResp.status);
  if (!tResp.ok) throw new Error('vol09_line_timings.json ' + tResp.status);
  const dialogue = await dResp.json();
  const timings = await tResp.json();
  const tMap = {};
  timings.parts.forEach(p => { tMap[p.id] = p; });
  PARTS_DATA = dialogue.parts.map(p => {
    const tParts = tMap[p.id] || { lines: [] };
    return {
      id: p.id,
      title: p.title,
      lines: p.dialogue.map((d, i) => {
        const t = tParts.lines[i] || {};
        return {
          idx: i, role: d.role, en: d.en, zh: d.zh,
          start: t.start || 0, end: t.end || 0, duration: t.duration || 0,
        };
      }),
    };
  });
  TOTAL_LINES = PARTS_DATA.reduce((s, p) => s + p.lines.length, 0);
}
const AUDIO_BASE = 'https://wangdn2026.github.io/ehs-english-cards/audio/';
// TOTAL_LINES 改由 loadData() 动态计算

// ====== 录音能力检测（极简版：2026-07-31 砍掉 file input 降级）======
// 只能 hold（页内录音）；不支持 getUserMedia → 按钮置灰 + 提示文字，不弹任何东西
const SUPPORTS_RECORD = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);

// 冬妮明确要求"不要任何顶部提示" → modeBadge / tipsBox 一律不显示
const modeBadge = document.getElementById('modeBadge');
const tipsBox = document.getElementById('tipsBox');
if (modeBadge) modeBadge.style.display = 'none';
if (tipsBox) tipsBox.style.display = 'none';

// 浏览器不支持录音时，延迟把按钮全部置灰（等 bindLine 注册完）
if (!SUPPORTS_RECORD) {
  window.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.btn-hold').forEach(btn => {
      btn.disabled = true;
      btn.innerHTML = '🚫 <b>此浏览器不支持录音</b>';
      btn.title = '请在 Chrome / Safari 中打开';
      btn.style.opacity = '0.5';
      btn.style.cursor = 'not-allowed';
    });
  });
}

// === 极简版：只保留听原音 / 录自己 / 听自己录的；不再打分 ===
const lineState = {};

const audioPlayer = new Audio();
audioPlayer.preload = 'auto';
let currentPlayBtn = null;
audioPlayer.onplay = () => { if (currentPlayBtn) currentPlayBtn.classList.add('playing'); };
audioPlayer.onended = () => { if (currentPlayBtn) { currentPlayBtn.classList.remove('playing'); currentPlayBtn = null; } };
audioPlayer.onpause = () => { if (currentPlayBtn) currentPlayBtn.classList.remove('playing'); };

function playSegment(btn, start, end) {
  audioPlayer.src = AUDIO_BASE + 'vol09_museum_contractor_full.mp3';
  audioPlayer.currentTime = start;
  currentPlayBtn = btn;
  audioPlayer.play().catch(e => console.warn('播放失败', e));
  const check = () => {
    if (audioPlayer.currentTime >= end) { audioPlayer.pause(); }
    else if (!audioPlayer.paused) requestAnimationFrame(check);
  };
  requestAnimationFrame(check);
}

function getScoreStyle(total) {
  // 4 档颜色：90+ 深绿 / 70-89 中绿 / 50-69 浅绿 / <50 红（暂未使用，保留备用）
  if (total >= 90) return { grade: '优秀 Excellent', color: '#4A8B3A' };
  if (total >= 70) return { grade: '良好 Good', color: '#7CB069' };
  if (total >= 50) return { grade: '还行 OK', color: '#B5D4A0' };
  return { grade: '没读到 Try Again', color: '#E07A5F' };
}

function clearWaveform(waveformEl) {
  const bars = waveformEl.querySelectorAll('.wave-bar');
  bars.forEach(b => { b.style.height = '4px'; b.classList.remove('live', 'user', 'rec'); });
}

function updateProgress() {
  const doneCount = Object.values(lineState).filter(s => s.done).length;
  const fill = document.getElementById('progFill');
  const text = document.getElementById('progText');
  if (fill) fill.style.width = (doneCount / TOTAL_LINES * 100) + '%';
  if (text) text.textContent = doneCount + ' / ' + TOTAL_LINES + ' 已打卡';
}

const STORAGE_KEY = 'vol09_readalong_done';
function loadProgress() {
  try {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    Object.entries(data).forEach(([k, v]) => {
      if (v && v.done) {
        lineState[k] = v;
        const el = document.querySelector('[data-line-key="' + k + '"]');
        if (el) el.classList.add('done');
      }
    });
    updateProgress();
  } catch (e) {}
}
function saveProgress(key) {
  const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  data[key] = lineState[key];
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
}

// ====== 长按录音（HOLD 模式）======
// 单例：全局只允许一个录音进行
let activeHoldSession = null;

function showHoldMask(lineEl, show) {
  let mask = document.getElementById('holdMask');
  if (!mask) {
    mask = document.createElement('div');
    mask.id = 'holdMask';
    mask.className = 'rec-mask';
    mask.innerHTML = `
      <div class="rec-mask-mic">🎙</div>
      <div class="rec-mask-text">正在录音…</div>
      <div class="rec-mask-timer" id="holdMaskTimer">0.0s</div>
      <div class="rec-mask-hint">再点一次按钮结束</div>
    `;
    document.body.appendChild(mask);
  }
  if (show) {
    mask.classList.add('show');
    document.getElementById('holdMaskTimer').textContent = '0.0s';
  } else {
    mask.classList.remove('show');
  }
  // 简化 mask 提示
  if (show) {
    const hintEl = mask.querySelector('.rec-mask-hint');
    if (hintEl) hintEl.textContent = '再点一次按钮结束';
  }
}

async function startHoldRecord(lineEl, ctx) {
  if (activeHoldSession) return; // 已有录音中
  const { key, partId, lineIdx, start, end, refDuration } = ctx;

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    throw Object.assign(new Error('浏览器不支持'), { name: 'NotSupportedError' });
  }

  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (err) { throw err; }

  const chunks = [];
  // 尝试用 audio/webm；iOS Safari 可能不支持，会回退到默认
  let mimeType = '';
  const candidates = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg'];
  for (const t of candidates) {
    if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) { mimeType = t; break; }
  }
  const recorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);

  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const source = audioCtx.createMediaStreamSource(stream);
  const analyser = audioCtx.createAnalyser();
  analyser.fftSize = 512;
  source.connect(analyser);
  const dataArray = new Uint8Array(analyser.fftSize);

  const waveformEl = lineEl.querySelector('.waveform');
  const bars = waveformEl.querySelectorAll('.wave-bar');
  let recStartTime = 0;
  let recTimer = null;
  let drawTimer = null;
  let cancelled = false;

  function drawLive() {
    if (cancelled) return;
    analyser.getByteTimeDomainData(dataArray);
    let sum = 0;
    for (let i = 0; i < dataArray.length; i++) {
      const v = (dataArray[i] - 128) / 128;
      sum += v * v;
    }
    const rms = Math.sqrt(sum / dataArray.length);
    for (let i = 0; i < bars.length - 1; i++) {
      bars[i].style.height = bars[i + 1].style.height;
      bars[i].className = bars[i + 1].className;
    }
    const h = Math.max(4, Math.min(28, rms * 80));
    bars[bars.length - 1].style.height = h + 'px';
    bars[bars.length - 1].classList.add('rec');
    drawTimer = requestAnimationFrame(drawLive);
  }

  function tickTimer() {
    if (cancelled) return;
    const elapsed = (Date.now() - recStartTime) / 1000;
    const txt = document.getElementById('holdMaskTimer');
    if (txt) txt.textContent = elapsed.toFixed(1) + 's';
    if (elapsed >= 30) {
      // 自动停止
      stopHoldRecord();
      return;
    }
    recTimer = requestAnimationFrame(tickTimer);
  }

  const session = {
    lineEl, ctx, stream, recorder, audioCtx, analyser, chunks,
    cancelled: false, finished: false,
  };

  const finishPromise = new Promise((resolve) => {
    recorder.onstop = async () => {
      if (session.finished) return;
      session.finished = true;
      if (drawTimer) cancelAnimationFrame(drawTimer);
      if (recTimer) cancelAnimationFrame(recTimer);
      stream.getTracks().forEach(t => t.stop());
      audioCtx.close().catch(() => {});

      if (cancelled || chunks.length === 0) {
        clearWaveform(waveformEl);
        resolve(null);
        return;
      }

      // 加 text 给 requestScore 用
      const scoreCtx = { ...ctx, text: lineEl.querySelector('.line-en').textContent };
      const blob = new Blob(chunks, { type: mimeType || 'audio/webm' });
      const url = URL.createObjectURL(blob);
      // 立即触发评分（异步，不阻塞 UI）
      requestScore(blob, lineEl, scoreCtx);

      // 简单获取时长（不调 scorer）
      let duration = 0;
      try {
        const tmpA = new Audio(url);
        await new Promise((res) => { tmpA.addEventListener('loadedmetadata', res, { once: true }); tmpA.addEventListener('error', res, { once: true }); });
        duration = tmpA.duration || 0;
      } catch (e) { duration = 0; }

      if (duration > 0 && duration < 0.3) {
        URL.revokeObjectURL(url);
        clearWaveform(waveformEl);
        window.__showRecModal('录音太短', '请再录长一点（至少 0.3 秒）');
        resolve(null);
        return;
      }
      if (duration > 30) {
        URL.revokeObjectURL(url);
        clearWaveform(waveformEl);
        window.__showRecModal('录音太长', '一句话最多 30 秒');
        resolve(null);
        return;
      }

      // 切到完成态 UI：显示"▶ 听自己"和"重录"
      const recBtn = lineEl.querySelector('.btn-hold');
      const replayBtn = lineEl.querySelector('.btn-replay');
      const retryBtn = lineEl.querySelector('.btn-retake');
      recBtn.style.display = 'none';
      replayBtn.dataset.url = url;
      replayBtn.style.display = 'inline-flex';
      retryBtn.style.display = 'inline-flex';
      lineEl.classList.remove('recording');
      lineEl.classList.add('done');
      lineState[key] = { done: true };
      saveProgress(key);
      updateProgress();
      resolve({ duration });
    };

    recorder.onerror = (e) => { window.__showRecModal('录音出错', (e.error && e.error.message) || '未知错误'); };
  });

  recorder.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); };

  recorder.start();
  recStartTime = Date.now();
  showHoldMask(lineEl, true);
  lineEl.classList.add('recording');
  drawLive();
  tickTimer();

  activeHoldSession = session;
  session.finishPromise = finishPromise;
  return session;
}

function stopHoldRecord() {
  const s = activeHoldSession;
  if (!s) return;
  activeHoldSession = null;
  showHoldMask(s.lineEl, false);
  if (s.recorder && s.recorder.state !== 'inactive') {
    s.recorder.stop();
  }
}

function cancelHoldRecord() {
  const s = activeHoldSession;
  if (!s) return;
  s.cancelled = true;
  activeHoldSession = null;
  showHoldMask(s.lineEl, false);
  if (s.recorder && s.recorder.state !== 'inactive') {
    s.recorder.stop();
  }
  clearWaveform(s.lineEl.querySelector('.waveform'));
  s.lineEl.classList.remove('recording');
}

// ====== file input 降级已砍（2026-07-31 反馈：跳系统录音 App 体验极差）======
// 改为：浏览器不支持 → 按钮置灰；getUserMedia 失败 → 按钮下方 inline 错误（手机能看到）
async function showRecordError(lineEl, err) {
  const recBtn = lineEl.querySelector('.btn-hold');
  if (!recBtn) return;
  // 移除旧错误
  const oldErr = lineEl.querySelector('.rec-error');
  if (oldErr) oldErr.remove();

  // 错误分类（2026-07-31 扩展：覆盖更多错误码 + 显示浏览器信息）
  const name = err && err.name ? err.name : '';
  const msgRaw = err && err.message ? err.message : '';
  const ua = navigator.userAgent;
  const isIOS = /iPhone|iPad|iPod/i.test(ua);
  const isAndroid = /Android/i.test(ua);
  const isWechat = /MicroMessenger/i.test(ua);
  const isOppoBrowser = /OPPO|OppoBrowser/i.test(ua);

  let reason = '';
  if (name === 'NotAllowedError' || name === 'PermissionDeniedError') {
    reason = '麦克风被拒绝授权';
    if (isWechat) reason += '（微信内请点右上角 · · · → 设置 → 麦克风，允许）';
    else if (isOppoBrowser) reason += '（OPPO 浏览器：设置 → 网站设置 → 麦克风，允许）';
    else reason += '（浏览器设置里允许麦克风权限，刷新页面）';
  } else if (name === 'NotFoundError' || name === 'DevicesNotFoundError') {
    reason = '没找到麦克风设备';
  } else if (name === 'NotReadableError' || name === 'TrackStartError') {
    reason = '麦克风被其他应用占用，请关闭后重试';
  } else if (name === 'OverconstrainedError') {
    reason = '麦克风参数不支持';
  } else if (name === 'NotSupportedError' || name === 'TypeError') {
    reason = '当前浏览器不支持录音';
    if (isWechat) reason += '（请点右上角 · · · 选择"在浏览器中打开"）';
    else if (isAndroid) reason += '（建议用 Chrome 打开）';
    else reason += '（请用 Chrome / Safari 打开）';
  } else if (name === 'SecurityError') {
    reason = '安全限制（需 https 或 localhost）';
  } else {
    reason = msgRaw || '未知错误';
  }

  recBtn.innerHTML = '⚠️ <b>点此重试</b>';
  recBtn.disabled = false;

  // 错误信息显示在按钮下方（手机能看到，2026-07-31 反馈加）
  // 同时给快捷操作：复制链接 + 微信好友 + 系统分享（2026-07-31 反馈：自动跳浏览器不灵）
  const errBox = document.createElement('div');
  errBox.className = 'rec-error';
  const currentUrl = location.href.split('?')[0];
  const isSecure = location.protocol === 'https:' || location.hostname === 'localhost';
  const chromeIntent = 'intent://wangdn2026.github.io/ehs-english-cards/readalong_vol09_museum_contractor.html#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' +
    encodeURIComponent(currentUrl) + ';end';
  const chromeScheme = 'googlechrome://navigate?url=' + encodeURIComponent(currentUrl);
  errBox.innerHTML = '<b>❌ ' + reason + '</b><br>' +
    '<span style="color:#888;font-size:11px">错误码: ' + name + ' | 浏览器: ' +
    (isWechat ? '微信' : isOppoBrowser ? 'OPPO浏览器' : isIOS ? 'iOS' : isAndroid ? 'Android' : '其他') + '</span><br>' +
    '<button class="open-chrome-btn" data-action="copy">📋 复制链接</button> ' +
    (navigator.share ? '<button class="open-chrome-btn" data-action="share">📤 系统分享</button> ' : '') +
    '<a href="' + chromeIntent + '" class="open-chrome-btn">👀 弹浏览器选择</a>';
  // 复制链接（带 fallback：旧浏览器用 execCommand）
  const copyBtn = errBox.querySelector('[data-action="copy"]');
  copyBtn.addEventListener('click', async () => {
    const txt = currentUrl + '?v=91bd854';
    let ok = false;
    try {
      if (isSecure && navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(txt);
        ok = true;
      }
    } catch (e) { ok = false; }
    if (!ok) {
      // fallback：旧方案
      const ta = document.createElement('textarea');
      ta.value = txt;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); ok = true; } catch (e) { ok = false; }
      document.body.removeChild(ta);
    }
    copyBtn.textContent = ok ? '✅ 已复制' : '❌ 复制失败';
    setTimeout(() => { copyBtn.textContent = '📋 复制链接'; }, 2000);
  });
  // 系统分享
  const shareBtn = errBox.querySelector('[data-action="share"]');
  if (shareBtn) {
    shareBtn.addEventListener('click', async () => {
      try {
        await navigator.share({ title: 'E.H.S. 跟读训练 Vol09', url: currentUrl + '?v=91bd854' });
      } catch (e) { /* 用户取消 */ }
    });
  }
  recBtn.parentNode.insertBefore(errBox, recBtn.nextSibling);
  console.error('[跟读训练] 录音失败', { name, message: msgRaw, ua, isWechat, isOppoBrowser, isAndroid, isIOS });
}

function bindLine(el) {
  const key = el.dataset.lineKey;
  const partId = el.dataset.partId;
  const lineIdx = parseInt(el.dataset.lineIdx);
  const start = parseFloat(el.dataset.start);
  const end = parseFloat(el.dataset.end);
  const refDuration = end - start;
  const ctx = { key, partId, lineIdx, start, end, refDuration };

  const playBtn = el.querySelector('.btn-play');
  const holdBtn = el.querySelector('.btn-hold');
  const replayBtn = el.querySelector('.btn-replay');
  const retryBtn = el.querySelector('.btn-retake');

  // 按钮文字统一
  holdBtn.innerHTML = '🎤 <b>点这里录</b>';
  holdBtn.classList.remove('guide');

  playBtn.addEventListener('click', () => {
    if (playBtn.classList.contains('playing')) {
      audioPlayer.pause();
      playBtn.classList.remove('playing');
    } else {
      playSegment(playBtn, start, end);
    }
  });

  // ====== 录音交互（页内录音，2026-07-31 砍掉 file 降级）======
  // 浏览器不支持 getUserMedia 时，由顶部 SUPPORTS_RECORD 监听统一置灰按钮
  if (SUPPORTS_RECORD) {
    // 单击切换：点开始，再点结束（更稳，Android 微信不吞单击）
    let holdStarted = false;
    const onToggle = async () => {
      if (!holdStarted) {
        // 开始
        holdStarted = true;
        holdBtn.classList.add('pressing');
        holdBtn.innerHTML = '⏹ <b>结束录音</b>';
        try {
          await startHoldRecord(el, ctx);
        } catch (err) {
          // 不再降级 file input，改为 inline 提示 + 重试按钮
          holdStarted = false;
          holdBtn.classList.remove('pressing');
          await showRecordError(el, err);
        }
      } else {
        // 结束
        holdStarted = false;
        holdBtn.classList.remove('pressing');
        if (activeHoldSession) stopHoldRecord();
      }
    };
    holdBtn.addEventListener('click', onToggle);
  }

  replayBtn.addEventListener('click', () => {
    if (replayBtn.dataset.url) {
      const a = new Audio(replayBtn.dataset.url);
      a.play().catch(e => console.warn('回放失败', e));
    }
  });

  retryBtn.addEventListener('click', () => {
    if (replayBtn.dataset.url) {
      URL.revokeObjectURL(replayBtn.dataset.url);
      replayBtn.dataset.url = '';
    }
    replayBtn.style.display = 'none';
    retryBtn.style.display = 'none';
    holdBtn.style.display = 'inline-flex';
    holdBtn.innerHTML = '🎤 <b>点这里录</b>';
    holdBtn.disabled = false;
    el.classList.remove('recording');
    clearWaveform(el.querySelector('.waveform'));
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ===== ISE 评分 fetch =====
async function blobToBase64(blob) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(blob);
  });
}

function parseScoreXml(xml) {
  // 提取 read_chapter 属性（总分/准确/流利/完整/拒绝标记）
  const chap = xml.match(/<read_chapter\s+([^>]+)>/);
  if (!chap) return null;
  const attrs = {};
  chap[1].replace(/(\w+)="([^"]*)"/g, (_, k, v) => { attrs[k] = v; });
  // 提取每个 word 节点
  const words = [];
  const wordRe = /<word\s+([^>]+)>/g;
  let m;
  while ((m = wordRe.exec(xml)) !== null) {
    const a = {};
    m[1].replace(/(\w+)="([^"]*)"/g, (_, k, v) => { a[k] = v; });
    if (a.content) words.push({ word: a.content, score: parseFloat(a.total_score || '0') });
  }
  return {
    total: parseFloat(attrs.total_score || '0'),
    accuracy: parseFloat(attrs.accuracy_score || '0'),
    fluency: parseFloat(attrs.fluency_score || '0'),
    integrity: parseFloat(attrs.integrity_score || '0'),
    isRejected: attrs.is_rejected === 'true',
    rejectType: parseInt(attrs.reject_type || '0', 10),
    wordCount: parseInt(attrs.word_count || '0', 10),
    words,
  };
}

async function requestScore(blob, lineEl, ctx) {
  const scoreArea = lineEl.querySelector('.score-area');
  // 显示 loading
  scoreArea.innerHTML = '<span class="score-loading">评测中…</span>';
  try {
    const b64 = await blobToBase64(blob);
    const resp = await fetch(ISE_PROXY + '/api/ise/score', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Proxy-Token': ISE_TOKEN,
      },
      body: JSON.stringify({
        audio_b64: b64,
        text: ctx.text,
        src_format: blob.type.includes('webm') ? 'webm' :
                     blob.type.includes('mp4') ? 'm4a' :
                     blob.type.includes('ogg') ? 'ogg' : 'webm',
      }),
    });
    const data = await resp.json();
    if (!data.ok) {
      scoreArea.innerHTML = '<div class="score-error"><b>❌ 评分失败</b><br>' +
        escapeHtml(data.err || '未知错误') +
        '<br><button class="score-retry" data-retry="1">🔄 重试</button></div>';
      lineEl.querySelector('.score-retry').addEventListener('click', () => requestScore(blob, lineEl, ctx));
      return;
    }
    const sc = parseScoreXml(data.xml);
    if (!sc) {
      scoreArea.innerHTML = '<div class="score-error"><b>❌ 解析评分失败</b><br>XML 格式异常' +
        '<br><button class="score-retry" data-retry="1">🔄 重试</button></div>';
      lineEl.querySelector('.score-retry').addEventListener('click', () => requestScore(blob, lineEl, ctx));
      return;
    }
    showScoreBox(lineEl, sc, blob, ctx);
  } catch (err) {
    scoreArea.innerHTML = '<div class="score-error"><b>❌ 网络错误</b><br>' +
      escapeHtml(err.message || '未知') +
      '<br><button class="score-retry" data-retry="1">🔄 重试</button></div>';
    lineEl.querySelector('.score-retry').addEventListener('click', () => requestScore(blob, lineEl, ctx));
  }
}

function showScoreBox(lineEl, sc, blob, ctx) {
  const scoreArea = lineEl.querySelector('.score-area');
  const t = tierOf(sc.total);
  const pct = (sc.total / 5 * 100).toFixed(0);
  const rej = sc.isRejected ? '<span style="color:#C0392B;margin-left:6px;font-size:11px">⚠ 评测被拒 (reject_type=' + sc.rejectType + ')</span>' : '';
  const wordsHtml = sc.words.length > 0 ? `
    <details class="score-words">
      <summary>📝 单词级详情 (${sc.wordCount} 词)</summary>
      <div class="score-words-list">
        ${sc.words.map(w => {
          const wt = tierOf(w.score);
          return `<span class="score-word" style="border-left:3px solid ${wt.color}">
            <b>${escapeHtml(w.word)}</b> <i style="color:${wt.color}">${w.score.toFixed(2)}</i>
          </span>`;
        }).join('')}
      </div>
    </details>` : '';
  scoreArea.innerHTML = `
    <div class="score-box">
      <div class="score-header">
        <span class="score-total" style="color:${t.color}">${sc.total.toFixed(2)}</span>
        <span class="score-grade" style="background:${t.color}">${pct}分 · ${t.grade}</span>
        ${rej}
      </div>
      <div class="score-detail">
        <span>准确 <b style="color:${tierOf(sc.accuracy).color}">${sc.accuracy.toFixed(2)}</b></span>
        <span>流利 <b style="color:${tierOf(sc.fluency).color}">${sc.fluency.toFixed(2)}</b></span>
        <span>完整 <b style="color:${tierOf(sc.integrity).color}">${sc.integrity.toFixed(2)}</b></span>
      </div>
      ${wordsHtml}
    </div>`;
  // 保存到 localStorage（带分）
  const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  stored[ctx.key] = { done: true, score: sc };
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(stored)); } catch (e) {}
}
